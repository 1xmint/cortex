name: Deploy

# Ships a build-release.yml artifact to the production host over Tailscale.
#
# Runs automatically after every successful build on main, and can also be
# triggered by hand (workflow_dispatch) against a specific build run — e.g. to
# redeploy an older release after a rollback investigation.
#
# Nothing here runs until the owner has added the four secrets checked in
# "Check secrets" below. Until then this workflow completes successfully with
# a ::notice:: and does nothing else — see docs/DEPLOY.md for setup.

on:
  workflow_run:
    workflows: [Build release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a build-release.yml run to deploy
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check secrets
        id: secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ] || \
             [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets are not configured (need TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS). See docs/DEPLOY.md. Skipping deploy."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve build run
        id: run
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "run_id=$RUN_ID" >>"$GITHUB_OUTPUT"

          artifact_name="$(
            gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[].name' \
            | grep -E '^cortex-release-[0-9a-f]{40}$' \
            | head -n1
          )"
          if [ -z "$artifact_name" ]; then
            echo "::error::No cortex-release-<sha> artifact found on run $RUN_ID"
            exit 1
          fi
          echo "artifact_name=$artifact_name" >>"$GITHUB_OUTPUT"
          echo "commit=${artifact_name#cortex-release-}" >>"$GITHUB_OUTPUT"

      - name: Download artifact
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Verify artifact checksums
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          commit="$(tr -d '[:space:]' <COMMIT)"
          if [ "$commit" != "${{ steps.run.outputs.commit }}" ]; then
            echo "::error::COMMIT in artifact ($commit) does not match artifact name (${{ steps.run.outputs.commit }})"
            exit 1
          fi

      - name: Package artifact for transport
        if: steps.secrets.outputs.ok == 'true'
        run: tar czf artifact.tgz -C release COMMIT SHA256SUMS bin www

      - name: Join tailnet
        if: steps.secrets.outputs.ok == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write deploy key and known_hosts
        if: steps.secrets.outputs.ok == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Send artifact to the host
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            guardian@clawguard.tail618cfc.ts.net \
            deploy <artifact.tgz

      - name: Wait for the deployed commit to go live
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -euo pipefail
          expected="${{ steps.run.outputs.commit }}"
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS https://api.heyvera.org/api/deploy-info 2>/dev/null || true)"
            live="$(printf '%s' "$body" | grep -o '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' || true)"
            if [ "$live" = "$expected" ]; then
              echo "deploy-info reports commit $live — deploy confirmed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api.heyvera.org/api/deploy-info did not report commit $expected within 5 minutes"
          exit 1

      - name: Clean up deploy key
        if: always() && steps.secrets.outputs.ok == 'true'
        run: rm -rf "$RUNNER_TEMP/ssh"
