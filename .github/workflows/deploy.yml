name: Deploy

# Ships a build-release.yml artifact to the production host over Tailscale.
#
# Runs automatically after every successful build on main, and can also be
# triggered by hand (workflow_dispatch) against a specific build run — e.g. to
# redeploy an older release after a rollback investigation.
#
# CI joins the tailnet as an ephemeral tag:ci node and connects to the deploy
# host with Tailscale SSH as guardian — no deploy private key or
# authorized_keys forced command involved; the tailnet ACL (see docs/DEPLOY.md)
# is what limits tag:ci to that host. Nothing here runs until the owner has
# added the two secrets checked in "Check secrets" below. Until then this
# workflow completes successfully with a ::notice:: and does nothing else —
# see docs/DEPLOY.md for setup.

on:
  workflow_run:
    workflows: [Build release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID of a build-release.yml run to deploy
        type: string
        required: true
      allow_migration:
        description: >-
          Allow this deploy to migrate the production schema. Automatic
          deploys (workflow_run) never set this; deploy-receive.sh refuses a
          migrating deploy without it. See docs/DEPLOY.md.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/build-release.yml') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check secrets
        id: secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::notice::Deploy secrets are not configured (need TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET). See docs/DEPLOY.md. Skipping deploy."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi

      # A workflow_run event is a snapshot of the build that triggered it. If
      # another push to main built (build-release.yml ran again) while this
      # run was queued, this build is stale — deploying it now would overwrite
      # the newer release. Comparing against main's HEAD commit is the wrong
      # check: main can advance for reasons that don't produce a new build
      # (docs, workflow files outside build-release.yml's paths filter, etc.),
      # which would make this guard skip every real deploy. Compare instead
      # against the most recent push-triggered build-release.yml run on main.
      - name: Guard against a superseded workflow_run
        id: guard
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "proceed=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/$REPO/actions/workflows/build-release.yml/runs?branch=main&event=push&per_page=1" --jq '.workflow_runs[0].head_sha')"
          head_sha="${{ github.event.workflow_run.head_sha }}"
          if [ "$head_sha" != "$latest" ]; then
            echo "::notice::build $head_sha is not the newest push build of build-release.yml on main ($latest); a newer push superseded it. Skipping deploy."
            echo "proceed=false" >>"$GITHUB_OUTPUT"
          else
            echo "proceed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Resolve build run
        id: run
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::build_run_id '$RUN_ID' is not a plain run id"
            exit 1
          fi

          run_info="$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '[.path,.event,.head_branch,.head_repository.full_name,.conclusion,.head_sha]|@tsv')"
          IFS=$'\t' read -r run_path run_event run_branch run_repo run_conclusion head_sha <<<"$run_info"

          if [ "$run_path" != ".github/workflows/build-release.yml" ] || \
             { [ "$run_event" != "push" ] && [ "$run_event" != "workflow_dispatch" ]; } || \
             [ "$run_branch" != "main" ] || \
             [ "$run_repo" != "$REPO" ] || \
             [ "$run_conclusion" != "success" ]; then
            echo "::error::run $RUN_ID is not a successful build-release.yml run on main in $REPO (path=$run_path event=$run_event branch=$run_branch repo=$run_repo conclusion=$run_conclusion)"
            exit 1
          fi

          # $run_branch reporting "main" only reflects the ref the run was
          # triggered on; it says nothing about whether that commit is still
          # reachable from main today (a manual build_run_id could point at a
          # run from a since-force-pushed or deleted branch). Confirm the
          # build commit is actually on main's history.
          compare_status="$(gh api "repos/$REPO/compare/$head_sha...main" --jq .status)"
          if [ "$compare_status" != "identical" ] && [ "$compare_status" != "ahead" ]; then
            echo "::error::run $RUN_ID's commit $head_sha is not on main (compare status: $compare_status)"
            exit 1
          fi

          artifact_name="$(
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[].name' \
            | grep -E '^cortex-release-[0-9a-f]{40}$' \
            | head -n1
          )"
          if [ -z "$artifact_name" ]; then
            echo "::error::No cortex-release-<sha> artifact found on run $RUN_ID"
            exit 1
          fi

          echo "run_id=$RUN_ID" >>"$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >>"$GITHUB_OUTPUT"
          echo "commit=${artifact_name#cortex-release-}" >>"$GITHUB_OUTPUT"

      - name: Download artifact
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Verify artifact checksums
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          commit="$(tr -d '[:space:]' <COMMIT)"
          if [ "$commit" != "${{ steps.run.outputs.commit }}" ]; then
            echo "::error::COMMIT in artifact ($commit) does not match artifact name (${{ steps.run.outputs.commit }})"
            exit 1
          fi

      - name: Package artifact for transport
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        run: tar czf artifact.tgz -C release COMMIT SCHEMA SHA256SUMS bin www

      # Tailscale SSH (not a deploy private key) authenticates the connection
      # below: the tailnet ACL grants tag:ci an "ssh" rule to reach guardian on
      # the deploy host, so joining the tailnet as tag:ci is all CI needs.
      - name: Join tailnet
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Send artifact to the host
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        env:
          # The automatic workflow_run path never sets this; only a manual
          # workflow_dispatch run with allow_migration=true does. See
          # docs/DEPLOY.md and scripts/deploy/deploy-receive.sh.
          ALLOW_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_migration && 'true' || '' }}
        run: |
          set -euo pipefail
          receive_cmd='~/cortex-next/deploy-receive.sh'
          if [ -n "$ALLOW_MIGRATION" ]; then
            receive_cmd="$receive_cmd --allow-migration"
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new \
            guardian@clawguard.tail618cfc.ts.net \
            "$receive_cmd" <artifact.tgz

      - name: Wait for the deployed commit to go live
        if: steps.secrets.outputs.ok == 'true' && steps.guard.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          expected="${{ steps.run.outputs.commit }}"
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --max-time 10 https://api.heyvera.org/api/deploy-info 2>/dev/null || true)"
            live="$(printf '%s' "$body" | grep -o '"commit"[[:space:]]*:[[:space:]]*"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' || true)"
            if [ "$live" = "$expected" ]; then
              echo "deploy-info reports commit $live — deploy confirmed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api.heyvera.org/api/deploy-info did not report commit $expected within 5 minutes"
          exit 1
