name: Build release

# Builds what a host needs to run Cortex, and nothing else: the server, worker
# and worker-key binaries plus the built web app, uploaded as one artifact;
# optionally (input `images`) the worker's container images as a second one.
#
# It does not deploy. deploy.yml watches for a successful run of this workflow
# on main and ships the resulting artifact to the production host over
# Tailscale, but only once the owner has configured its secrets (see
# docs/DEPLOY.md) — until then, copying the artifact to a host stays a manual
# step (see docs/operations/).
#
# Built on ubuntu-24.04 because the production host runs Ubuntu 24.04: the
# binaries link against the runner's glibc, and a newer runner could produce a
# binary the host cannot load.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'cortex/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      images:
        description: Also build the worker's container images (sandbox, egress, runner)
        type: boolean
        default: false

permissions:
  contents: read

# A push that lands while an earlier build for the same ref is still running
# would otherwise let the slower (older) build finish last and get picked up
# by deploy.yml's workflow_run trigger after the newer one already deployed.
# Cancel the older push build; leave workflow_dispatch runs alone since those
# are usually a deliberate one-off (e.g. building images) and canceling one
# because another started could surprise whoever kicked it off. The group
# includes github.event_name, not just github.ref, so a push to main can't
# land in the same group as (and cancel) an in-progress workflow_dispatch run
# on that same ref.
concurrency:
  group: build-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # cortex-worker-key issues worker credentials on the host, next to the
      # database; there is deliberately no HTTP route for it.
      - name: Build server, worker and worker-key tool
        run: cargo build --release --locked -p cortex-api --bin cortex-server --bin cortex-worker-key -p cortex-worker --bin cortex-worker

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cortex/package-lock.json

      # The Clerk publishable key is public (it ships in every page load), but
      # it names one Clerk instance, so it lives in a repository variable rather
      # than in this file. Without it the app builds with sign-in switched off.
      - name: Build web app
        working-directory: cortex
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble
        run: |
          mkdir -p out/bin
          cp target/release/cortex-server target/release/cortex-worker target/release/cortex-worker-key out/bin/
          cp -r cortex/dist out/www
          git rev-parse HEAD > out/COMMIT

          # The schema the migration chain on this commit ends at. deploy.yml
          # and deploy-receive.sh compare this against the live database's
          # schema_version to refuse an automatic deploy that would migrate
          # production (see docs/DEPLOY.md). Fail loudly if it can't be found
          # rather than silently shipping an artifact deploy tooling can't
          # reason about.
          mapfile -t schema_versions < <(grep -E '^pub const SCHEMA_VERSION: u32 = [0-9]+;' crates/api/src/db/mod.rs | grep -oE '[0-9]+')
          if [ "${#schema_versions[@]}" -ne 1 ]; then
            echo "::error::expected exactly one SCHEMA_VERSION const in crates/api/src/db/mod.rs, found ${#schema_versions[@]}"
            exit 1
          fi
          schema_version="${schema_versions[0]}"
          echo "$schema_version" > out/SCHEMA

          (cd out && sha256sum bin/* COMMIT SCHEMA > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-release-${{ github.sha }}
          path: out/
          retention-days: 14

  # The worker's containers, tagged with this commit and run, so a receipt
  # naming an image names the commit it came from and no rebuild can reuse the
  # tag; the image ID in IMAGES names the image itself. Built here because
  # the host is too small to compile the egress mediator itself. Shipped as a
  # `docker save` archive; the host loads it with `docker load`.
  images:
    if: inputs.images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Build images
        run: |
          set -euo pipefail
          tag="$(git rev-parse --short=12 HEAD)-${{ github.run_id }}"
          docker build -f Dockerfile.sandbox -t "cortex/sandbox:base-$tag" .
          docker build -f Dockerfile.sandbox-provider \
            --build-arg BASE="cortex/sandbox:base-$tag" \
            -t "cortex/sandbox:$tag" .
          docker build -f Dockerfile.egress -t "cortex/egress:$tag" .
          docker build -f Dockerfile.runner -t "cortex/runner:$tag" .
          mkdir -p images
          docker save "cortex/sandbox:$tag" "cortex/egress:$tag" "cortex/runner:$tag" \
            | gzip -1 > images/cortex-images.tar.gz
          for i in sandbox egress runner; do
            id=$(docker image inspect --format '{{.Id}}' "cortex/$i:$tag")
            echo "cortex/$i:$tag $id"
          done > images/IMAGES
          git rev-parse HEAD > images/COMMIT
          (cd images && sha256sum cortex-images.tar.gz IMAGES COMMIT > SHA256SUMS)
          cat images/IMAGES

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-images-${{ github.sha }}
          path: images/
          retention-days: 14
          compression-level: 0
