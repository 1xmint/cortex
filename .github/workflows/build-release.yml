name: Build release

# Builds what a host needs to run Cortex, and nothing else: the server and
# worker binaries plus the built web app, uploaded as one artifact.
#
# It does not deploy. The repository holds no host credentials, so copying the
# artifact to a host is a separate, manual step (see docs/operations/).
#
# Built on ubuntu-24.04 because the production host runs Ubuntu 24.04: the
# binaries link against the runner's glibc, and a newer runner could produce a
# binary the host cannot load.

on:
  workflow_dispatch:
    inputs:
      images:
        description: Also build the worker's container images (sandbox, egress, runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # cortex-worker-key issues worker credentials on the host, next to the
      # database; there is deliberately no HTTP route for it.
      - name: Build server, worker and worker-key tool
        run: cargo build --release --locked -p cortex-api --bin cortex-server --bin cortex-worker-key -p cortex-worker --bin cortex-worker

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cortex/package-lock.json

      # The Clerk publishable key is public (it ships in every page load), but
      # it names one Clerk instance, so it lives in a repository variable rather
      # than in this file. Without it the app builds with sign-in switched off.
      - name: Build web app
        working-directory: cortex
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build

      - name: Assemble
        run: |
          mkdir -p out/bin
          cp target/release/cortex-server target/release/cortex-worker target/release/cortex-worker-key out/bin/
          cp -r cortex/dist out/www
          git rev-parse HEAD > out/COMMIT
          (cd out && sha256sum bin/* > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-release-${{ github.sha }}
          path: out/
          retention-days: 14

  # The worker's containers, built from this commit and tagged with it, so a
  # receipt naming an image names the source it came from. Built here because
  # the host is too small to compile the egress mediator itself. Shipped as a
  # `docker save` archive; the host loads it with `docker load`.
  images:
    if: inputs.images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Build images
        run: |
          set -euo pipefail
          tag=$(git rev-parse --short=12 HEAD)
          docker build -f Dockerfile.sandbox -t "cortex/sandbox:base-$tag" .
          docker build -f Dockerfile.sandbox-provider \
            --build-arg BASE="cortex/sandbox:base-$tag" \
            -t "cortex/sandbox:$tag" .
          docker build -f Dockerfile.egress -t "cortex/egress:$tag" .
          docker build -f Dockerfile.runner -t "cortex/runner:$tag" .
          mkdir -p images
          docker save "cortex/sandbox:$tag" "cortex/egress:$tag" "cortex/runner:$tag" \
            | gzip -1 > images/cortex-images.tar.gz
          for i in sandbox egress runner; do
            echo "cortex/$i:$tag $(docker image inspect --format '{{.Id}}' "cortex/$i:$tag")"
          done > images/IMAGES
          git rev-parse HEAD > images/COMMIT
          (cd images && sha256sum cortex-images.tar.gz > SHA256SUMS)
          cat images/IMAGES

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cortex-images-${{ github.sha }}
          path: images/
          retention-days: 14
          compression-level: 0
