<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
  body { font-family: sans-serif; margin: 1em; }
  #board { display: flex; gap: 1em; align-items: flex-start; }
  .column { flex: 1; min-height: 200px; background: #eee; padding: .5em; border-radius: 6px; }
  .column.over { outline: 2px dashed #48c; }
  .card { background: #fff; margin: .4em 0; padding: .4em; border-radius: 4px; cursor: grab; }
  .card[hidden] { display: none; }
  .card button { font-size: .8em; }
</style>
</head>
<body>
<h1>Kanban</h1>
<p>
  <input id="new-card" placeholder="New card"> <button id="add">Add</button>
  <input id="filter" placeholder="Filter">
</p>
<div id="board">
  <section class="column" id="col-todo"><h2>To do (<span class="count">0</span>)</h2><div class="cards"></div></section>
  <section class="column" id="col-doing"><h2>Doing (<span class="count">0</span>)</h2><div class="cards"></div></section>
  <section class="column" id="col-done"><h2>Done (<span class="count">0</span>)</h2><div class="cards"></div></section>
</div>
<script src="board.js"></script>
</body>
</html>
