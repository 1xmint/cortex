<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expenses</title>
<style>
  body { font-family: sans-serif; margin: 2em; max-width: 40em; }
  form { display: flex; gap: 0.5em; flex-wrap: wrap; margin-bottom: 1em; }
  #error { color: #b00; }
  #list { list-style: none; padding: 0; }
  .expense { display: flex; gap: 1em; padding: 0.3em 0; border-bottom: 1px solid #ddd; }
  .amount { margin-left: auto; }
  .category { color: #666; }
</style>
</head>
<body>
<h1>Expenses</h1>
<form id="add">
  <input id="description" placeholder="What was it?">
  <input id="amount" type="number" step="0.01" placeholder="Amount">
  <input id="date" type="date">
  <select id="category">
    <option value="food" selected>Food</option>
    <option value="transport">Transport</option>
    <option value="home">Home</option>
    <option value="fun">Fun</option>
    <option value="other">Other</option>
  </select>
  <button id="save" type="submit">Add</button>
</form>
<p id="error" hidden></p>
<ul id="list"></ul>
<p>Total: <b id="total">0.00</b></p>
<p>
  <label>Month <input id="month" type="month"></label>
  <b id="month-total">0.00</b>
</p>
<canvas id="chart" width="400" height="200"></canvas>
<p><button id="export" type="button">Download CSV</button></p>
<script src="app.js"></script>
</body>
</html>
