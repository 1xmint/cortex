<!doctype html>
<html>
<head><meta charset="utf-8"><title>Counter</title></head>
<body>
<h1>Counter</h1>
<p id="count">0</p>
<button id="plus">+</button>
<script>
let n = 0;
const count = document.getElementById("count");
document.getElementById("plus").addEventListener("click", () => {
  n += 1;
  count.textContent = String(n);
});
</script>
</body>
</html>
